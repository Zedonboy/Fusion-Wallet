[package]
name = "fusion_wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.17"
ic-cdk-timers = "0.11" # Feel free to remove this dependency if you don't need timers
spki = "0.7.3"
const-oid = "0.9.6"
der = { version = "0.7.9", features = ["alloc"] }

[build-dependencies]
dotenv = "0.15.0"

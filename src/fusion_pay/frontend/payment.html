<!DOCTYPE html>
<html>
<head>
    <title>Fusion Pay</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="description" content="Fusion Pay - {{ message}}">
    <meta property="og:title" content="Fusion Pay">
    <meta property="og:description" content="{{ message }}">
    <meta property="og:image" content="https://wxakm-ayaaa-aaaam-aejqa-cai.icp0.io/bg.png">
    <meta property="og:url" content="https://wxakm-ayaaa-aaaam-aejqa-cai.icp0.io/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Fusion Pay">
    <meta name="twitter:description" content="{{ message }}">
    <meta name="twitter:image" content="https://wxakm-ayaaa-aaaam-aejqa-cai.icp0.io/bg.png">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <nav class="bg-white border-gray-200 px-4 lg:px-6 py-2.5 dark:bg-gray-800">
          <div
            class="flex flex-wrap justify-between items-center mx-auto max-w-screen-xl"
          >
            <a href="https://fusionwallet.me" class="flex items-center">
              <img
                src="https://fusionwallet.me/fusion_web_logo.png"
                class="mr-3 h-6 sm:h-9"
                alt="Fusion Logo"
              />
              <span
                class="self-center text-xl font-semibold whitespace-nowrap dark:text-white"
                >Fusion</span
              >
            </a>
            <div class="flex items-center lg:order-2">
              <div class="hidden md:block">
                <a href="https://internetcomputer.org/" target="_blank">
                  <img src="https://fusionwallet.me/built_on.png" class="h-12" />
                </a>
              </div>
             
              <button
                data-collapse-toggle="mobile-menu-2"
                type="button"
                class="inline-flex items-center p-2 ml-1 text-sm text-gray-500 rounded-lg lg:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600"
                aria-controls="mobile-menu-2"
                aria-expanded="false"
              >
                <span class="sr-only">Open main menu</span>
                <svg
                  class="w-6 h-6"
                  fill="currentColor"
                  viewBox="0 0 20 20"
                  xmlns="http://www.w3.org/2000/svg"
                  ><path
                    fill-rule="evenodd"
                    d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
                    clip-rule="evenodd"
                  ></path></svg
                >
                <svg
                  class="hidden w-6 h-6"
                  fill="currentColor"
                  viewBox="0 0 20 20"
                  xmlns="http://www.w3.org/2000/svg"
                  ><path
                    fill-rule="evenodd"
                    d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                    clip-rule="evenodd"
                  ></path></svg
                >
              </button>
            </div>
            <div
              class="hidden justify-between items-center w-full lg:flex lg:w-auto lg:order-1"
              id="mobile-menu-2"
            >
              <ul
                class="flex flex-col mt-4 font-medium lg:flex-row lg:space-x-8 lg:mt-0"
              >
                <li>
                  <a
                    href="#"
                    class="block py-2 pr-4 pl-3 text-white rounded bg-primary-700 lg:bg-transparent lg:text-primary-700 lg:p-0 dark:text-white"
                    aria-current="page">Home</a
                  >
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </header>
      
      <main class="container mx-auto p-4">
        <div class="max-w-md mx-auto bg-white rounded-xl border-2 border-gray-100 p-6">
          <div class="text-center mb-8">
            <h1 class="text-3xl font-bold mb-2 text-gray-800">{{ message }}</h1>
            <p class="text-gray-500">Scan QR code or use direct link below</p>
            <div class="hidden">
              <input type="hidden" id="qr_data" name="qr_data" value="{{ qr_data }}">
            </div>
          </div>
      
          <div class="mb-6 flex justify-center">
            <canvas id="qrcode" class="border-4 border-gray-100 rounded-lg p-2 w-64 h-64" height="256" width="256"/>
          </div>
      
          <div class="space-y-4">
            <a
              href="{{ http_url }}"
              target="_blank"
              class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors"
            >
              Open in Mobile Wallet
            </a>
            
            <div class="text-center text-sm text-gray-500 mt-2">
              <p>{{ memo }}</p>
            </div>
          </div>
        </div>
      </main>
      <script type="module" src="main.ts"></script>
</body>
</html>

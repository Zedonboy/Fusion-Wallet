[package]
name = "fusion_register"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.17"
ic-cdk-timers = "0.11" # Feel free to remove this dependency if you don't need timers
ic-ledger-types = "0.14.0"
serde = { version = "1.0", features = ["derive"] }
ic-stable-structures = "0.6.8"
name: Flutter Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for this release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_note:
        description: 'Release notes for this version'
        required: true
        default: 'Initial release'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0' # Specify your Flutter version

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu' # Use Zulu OpenJDK
          java-version: '11' # Java 11 is required for signing

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" > keystore.jks
          echo "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > keystore_password.txt
          echo "${{ secrets.ANDROID_KEY_ALIAS }}" > key_alias.txt
          echo "${{ secrets.ANDROID_KEY_PASSWORD }}" > key_password.txt

          jarsigner -verbose \
            -keystore keystore.jks \
            -storepass $(cat keystore_password.txt) \
            -keypass $(cat key_password.txt) \
            build/app/outputs/flutter-apk/app-release-unsigned.apk \
            $(cat key_alias.txt)

          zipalign -v 4 \
            build/app/outputs/flutter-apk/app-release-unsigned.apk \
            build/app/outputs/flutter-apk/app-release-signed.apk

      - name: Upload Signed APK as artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release-signed.apk
          path: build/app/outputs/flutter-apk/app-release-signed.apk

      - name: Upload App Bundle as artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Signed APK artifact
        uses: actions/download-artifact@v3
        with:
          name: app-release-signed.apk
          path: build/apk

      - name: Download App Bundle artifact
        uses: actions/download-artifact@v3
        with:
          name: app-release.aab
          path: build/aab

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag_name }} # Use the dynamic tag_name input
          release_name: Release ${{ github.event.inputs.tag_name }} # Use the dynamic tag_name input
          body: |
            ## Release Notes
            ${{ github.event.inputs.release_note }}
          draft: false
          prerelease: false

      - name: Upload Signed APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/apk/app-release-signed.apk
          asset_name: app-release-signed.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload App Bundle to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/aab/app-release.aab
          asset_name: app-release.aab
          asset_content_type: application/octet-stream
[package]
name = "fusion_pay"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.18.0"
ic-cdk-timers = "0.12.0" # Feel free to remove this dependency if you don't need timers
serde = { version = "1.0", features = ["derive"] }
ic-stable-structures = "0.6.8"
hex = "0.4.3"
ic-http-certification = "3.0.3"
lazy_static = "1.5.0"
include_dir = { version = "0.7", features = ["glob"] }
serde_json = "1.0"
handlebars = "6.3.2"
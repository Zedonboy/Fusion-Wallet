name: Flutter Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for this release (e.g., v1.0.0)'
        required: true
        default: '1.0.0'
      release_note:
        description: 'Release notes for this version'
        required: true
        default: 'Initial release'
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0' # Specify your Flutter version

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu' # Use Zulu OpenJDK
          java-version: '17' # Java 17 is required for signing

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          echo "storeFile=keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties

      - name: Build APK (Split by ABI)
        run: flutter build apk --split-per-abi --release --build-name=${{ github.event.inputs.tag_name }}
      
      - name: Build General APK
        run: flutter build apk --release --build-name=${{ github.event.inputs.tag_name }}

      - name: Build App Bundle
        run: flutter build appbundle --release --build-name=${{ github.event.inputs.tag_name }}

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build/app/outputs/flutter-apk/*-release.apk

      - name: Upload App Bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: appbundle
          path: build/app/outputs/bundle/release/app-release.aab

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download APKs artifact
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: build/apks

      - name: Download App Bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: appbundle
          path: build/appbundle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Release Notes
            ${{ github.event.inputs.release_note }}
          files: |
            build/apks/*.apk
            build/appbundle/app-release.aab
          tag_name: ${{ github.event.inputs.tag_name }}
          name: Release ${{ github.event.inputs.tag_name }}